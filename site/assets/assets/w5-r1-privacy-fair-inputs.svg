<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Information lanes and an approval gate</title><desc id="desc">Public, internal, confidential, and sensitive information lanes reach a gate. Only information that is necessary and approved can continue; other details stop or use a safer path.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Only approved, necessary information passes the gate</text><rect x="55" y="145" width="325" height="70" rx="14" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="130" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Public</text><text x="130" y="200" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Public schedule</text><line x1="380" y1="180" x2="480" y2="180" stroke="#34495E" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="154" width="195" height="52" rx="12" fill="#FFFFFF" stroke="#C78B2A" stroke-width="3"/><text x="587" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34495E">Need + approved?</text><line x1="685" y1="180" x2="770" y2="180" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="55" y="240" width="325" height="70" rx="14" fill="#EEF3F1" stroke="#34495E" stroke-width="3"/><text x="130" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Internal</text><text x="130" y="295" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Work notes</text><line x1="380" y1="275" x2="480" y2="275" stroke="#34495E" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="249" width="195" height="52" rx="12" fill="#FFFFFF" stroke="#C78B2A" stroke-width="3"/><text x="587" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34495E">Need + approved?</text><line x1="685" y1="275" x2="770" y2="275" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="55" y="335" width="325" height="70" rx="14" fill="#F8F1E8" stroke="#34495E" stroke-width="3"/><text x="130" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Confidential</text><text x="130" y="390" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Participant record</text><line x1="380" y1="370" x2="480" y2="370" stroke="#34495E" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="344" width="195" height="52" rx="12" fill="#F5E7E5" stroke="#8A3F37" stroke-width="3"/><text x="587" y="377" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A3F37">Stop / use safer path</text><rect x="55" y="430" width="325" height="70" rx="14" fill="#F5E7E5" stroke="#34495E" stroke-width="3"/><text x="130" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Sensitive</text><text x="130" y="485" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Personal details</text><line x1="380" y1="465" x2="480" y2="465" stroke="#34495E" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="439" width="195" height="52" rx="12" fill="#F5E7E5" stroke="#8A3F37" stroke-width="3"/><text x="587" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A3F37">Stop / use safer path</text><rect x="790" y="215" width="335" height="190" rx="18" fill="#FFF8EA" stroke="#C78B2A" stroke-width="3"/><text x="957" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Minimum safe input</text><text x="957" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Fictional or approved facts</text><text x="957" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34495E">then human fact check</text><text x="600" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5B6870">Shape and labels carry meaning; color is an additional cue.</text>
</svg>
