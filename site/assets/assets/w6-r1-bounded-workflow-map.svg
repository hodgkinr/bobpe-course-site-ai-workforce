<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Bounded AI-supported workplace workflow</title><desc id="desc">A workflow moves from trigger through minimum approved input, AI draft, source verification, human approval, and handoff. Sensitive, unclear, unsupported, or failed cases stop and route to an authorized person.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Map the work, checks, and handoff</text><rect x="35" y="195" width="165" height="150" rx="16" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="117" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">Trigger</text><text x="117" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#34495E">Routine request</text><line x1="200" y1="270" x2="220" y2="270" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="225" y="195" width="165" height="150" rx="16" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="307" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">Safe input</text><text x="307" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#34495E">Minimum approved facts</text><line x1="390" y1="270" x2="410" y2="270" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="415" y="195" width="165" height="150" rx="16" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="497" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">AI step</text><text x="497" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#34495E">Draft or category</text><line x1="580" y1="270" x2="600" y2="270" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="605" y="195" width="165" height="150" rx="16" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="687" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">Verify</text><text x="687" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#34495E">Compare with source</text><line x1="770" y1="270" x2="790" y2="270" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="795" y="195" width="165" height="150" rx="16" fill="#FFFFFF" stroke="#C78B2A" stroke-width="3"/><text x="877" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">Approve</text><text x="877" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#34495E">Human decision</text><line x1="960" y1="270" x2="980" y2="270" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="985" y="195" width="165" height="150" rx="16" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="1067" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">Handoff</text><text x="1067" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#34495E">Send or route</text><rect x="260" y="420" width="680" height="110" rx="18" fill="#F5E7E5" stroke="#8A3F37" stroke-width="3"/><text x="600" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#8A3F37">Stop and route to an authorized person</text><text x="600" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8A3F37">Sensitive · unclear · unsupported · tool error</text><line x1="300" y1="345" x2="300" y2="415" stroke="#8A3F37" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="490" y1="345" x2="490" y2="415" stroke="#8A3F37" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="680" y1="345" x2="680" y2="415" stroke="#8A3F37" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="870" y1="345" x2="870" y2="415" stroke="#8A3F37" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="600" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B6870">No sending, record change, or consequential decision without approval.</text>
</svg>
