<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Filter context before an AI request</title><desc id="desc">Possible details pass through task need, permission, and checkability gates. Sensitive or irrelevant details are removed; only minimum appropriate facts and a source reach the request.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Keep context relevant, approved, and checkable</text><rect x="55" y="155" width="300" height="330" rx="18" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="205" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Possible details</text><circle cx="95" cy="253" r="8" fill="#C78B2A" stroke="#34495E" stroke-width="2"/><text x="120" y="260" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Purpose and task</text><circle cx="95" cy="297" r="8" fill="#C78B2A" stroke="#34495E" stroke-width="2"/><text x="120" y="304" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Verified date</text><circle cx="95" cy="341" r="8" fill="#C78B2A" stroke="#34495E" stroke-width="2"/><text x="120" y="348" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Personal identifier</text><circle cx="95" cy="385" r="8" fill="#C78B2A" stroke="#34495E" stroke-width="2"/><text x="120" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Unneeded history</text><circle cx="95" cy="429" r="8" fill="#C78B2A" stroke="#34495E" stroke-width="2"/><text x="120" y="436" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Source facts</text><line x1="355" y1="320" x2="430" y2="320" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><path d="M440 170 L750 170 L690 420 L500 420 Z" fill="#FFF8EA" stroke="#34495E" stroke-width="3"/><text x="595" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Context filter</text><text x="595" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Need for task?</text><text x="595" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Approved to share?</text><text x="595" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Can it be checked?</text><text x="528" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#8A3F37">Remove sensitive or irrelevant details</text><line x1="750" y1="320" x2="825" y2="320" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="835" y="195" width="305" height="250" rx="18" fill="#FFFFFF" stroke="#C78B2A" stroke-width="3"/><text x="987" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Request input</text><text x="987" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Minimum useful facts</text><text x="987" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">plus evidence source</text><text x="987" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34495E">Human reviews result</text>
</svg>
