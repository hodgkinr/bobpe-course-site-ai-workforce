<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Evaluate baseline and trial before deciding</title><desc id="desc">Current practice and an AI-supported trial are compared using the same cases. Quality, total time, accessibility, safety, and escalation evidence inform an adopt with monitoring, revise and retest, or stop decision.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Compare the full process before choosing a path</text><rect x="55" y="150" width="245" height="250" rx="18" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="177" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Baseline</text><text x="177" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Current process</text><text x="177" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Quality · total time</text><text x="177" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Access · failure handling</text><rect x="55" y="425" width="245" height="150" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="177" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">AI-supported trial</text><text x="177" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Same cases and sources</text><text x="177" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Include human review time</text><line x1="300" y1="270" x2="385" y2="270" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><line x1="300" y1="500" x2="385" y2="500" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="395" y="180" width="390" height="330" rx="18" fill="#FFF8EA" stroke="#C78B2A" stroke-width="3"/><text x="590" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Compare evidence</text><text x="445" y="285" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34495E">Quality</text><text x="585" y="285" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Accuracy and completeness</text><text x="445" y="340" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34495E">Time</text><text x="585" y="340" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Setup + review + correction</text><text x="445" y="395" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34495E">Access</text><text x="585" y="395" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Clarity and next steps</text><text x="445" y="450" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34495E">Safety</text><text x="585" y="450" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Errors and escalation</text><line x1="785" y1="345" x2="850" y2="345" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="865" y="170" width="270" height="100" rx="16" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="1000" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#34495E">Adopt</text><text x="1000" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">with monitoring</text><rect x="865" y="300" width="270" height="100" rx="16" fill="#FFFFFF" stroke="#C78B2A" stroke-width="3"/><text x="1000" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#34495E">Revise</text><text x="1000" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">then retest</text><rect x="865" y="430" width="270" height="100" rx="16" fill="#F5E7E5" stroke="#8A3F37" stroke-width="3"/><text x="1000" y="468" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#8A3F37">Stop</text><text x="1000" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">or avoid</text><text x="600" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B6870">A small trial supports a narrow conclusion.</text>
</svg>
