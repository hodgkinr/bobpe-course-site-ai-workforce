<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Five-part task brief</title><desc id="desc">Five connected fields—goal, audience, context, constraints, and output shape—form a clear request that can be reviewed before use.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">A useful request makes the work inspectable</text><rect x="42" y="180" width="205" height="205" rx="16" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><circle cx="74" cy="215" r="19" fill="#C78B2A" stroke="#34495E" stroke-width="2"/><text x="74" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">1</text><text x="144" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Goal</text><text x="144" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Name the action</text><line x1="247" y1="282" x2="267" y2="282" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="274" y="180" width="205" height="205" rx="16" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><circle cx="306" cy="215" r="19" fill="#C78B2A" stroke="#34495E" stroke-width="2"/><text x="306" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">2</text><text x="376" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Audience</text><text x="376" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Who needs it?</text><line x1="479" y1="282" x2="499" y2="282" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="506" y="180" width="205" height="205" rx="16" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><circle cx="538" cy="215" r="19" fill="#C78B2A" stroke="#34495E" stroke-width="2"/><text x="538" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">3</text><text x="608" y="270" 