<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Adapted messages preserve intent</title><desc id="desc">One fictional message is adapted into a formal message and a plain-language note. Both preserve the same facts and question, without adding an unsupported promise.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Adapt the wording; preserve the facts and intent</text><rect x="70" y="190" width="280" height="245" rx="18" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="210" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Core message</text><text x="210" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Interested in the role</text><text x="210" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Application portal status</text><text x="210" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B6870">No promise of results</text><line x1="350" y1="310" x2="455" y2="310" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="465" y="145" width="300" height="170" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="615" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Formal message</text><text x="615" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">“I am interested in applying.</text><text x="615" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Is the portal currently open?”</text><rect x="465" y="365" width="300" height="170" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="615" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Plain-language note</text><text x="615" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">“I’d like to apply. Is the</text><text x="615" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">application site open now?”</text><line x1="765" y1="230" x2="850" y2="230" stroke="#C78B2A" stroke-width="4" marker-end="url(#arrow)"/><line x1="765" y1="450" x2="850" y2="450" stroke="#C78B2A" stroke-width="4" marker-end="url(#arrow)"/><rect x="865" y="190" width="280" height="245" rx="18" fill="#FFF8EA" stroke="#C78B2A" stroke-width="3"/><text x="1005" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Writer checks</text><text x="1005" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Same question</text><text x="1005" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#34495E">Same facts</text><text x="1005" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34495E">Voice feels accurate</text>
</svg>
