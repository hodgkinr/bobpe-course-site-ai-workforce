<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Task fit decision matrix</title><desc id="desc">A two-by-two matrix compares consequence and uncertainty. Greater consequence and uncertainty call for stronger review; the high-high quadrant points toward pausing, redesigning, or using another method.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="610" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Review grows with consequence and uncertainty</text><text x="605" y="615" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Uncertainty in the result  →</text><text x="60" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Consequence</text><rect x="350" y="140" width="290" height="190" rx="12" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="495" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#34495E">LOW consequence · LOW uncertainty</text><text x="495" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Standard source check</text><text x="495" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5B6870">Review level: routine</text><rect x="660" y="140" width="290" height="190" rx="12" fill="#FFF8EA" stroke="#34495E" stroke-width="3"/><text x="805" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#34495E">LOW consequence · HIGH uncertainty</text><text x="805" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8A3F37">Strong check + expert review</text><text x="805" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5B6870">Review level: higher</text><rect x="350" y="350" width="290" height="190" rx="12" fill="#FFF8EA" stroke="#34495E" stroke-width="3"/><text x="495" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#34495E">HIGH consequence · LOW uncertainty</text><text x="495" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Light review</text><text x="495" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5B6870">Review level: focused</text><rect x="660" y="350" width="290" height="190" rx="12" fill="#F5E7E5" stroke="#34495E" stroke-width="3"/><text x="805" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#34495E">HIGH consequence · HIGH uncertainty</text><text x="805" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Pause, redesign, or use another method</text><text x="805" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5B6870">Review level: strongest</text><text x="495" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5B6870">LOW</text><text x="805" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5B6870">HIGH</text><text x="260" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5B6870">LOW</text><text x="260" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5B6870">HIGH</text>
</svg>
