<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Verify a claim against a suitable source</title><desc id="desc">A claim is linked to an authoritative source, compared with it, and marked matched, corrected, or unresolved. Uncertainty remains visible when evidence is insufficient.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Trace each claim to evidence that can support it</text><rect x="55" y="195" width="240" height="190" rx="18" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="175" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Claim</text><text x="175" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">“The event starts at 6”</text><line x1="295" y1="290" x2="330" y2="290" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="340" y="195" width="240" height="190" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="460" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Source</text><text x="460" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Approved event plan</text><line x1="580" y1="290" x2="615" y2="290" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="625" y="195" width="240" height="190" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="745" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Compare</text><text x="745" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Check exact date and time</text><line x1="865" y1="290" x2="900" y2="290" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="910" y="195" width="240" height="190" rx="18" fill="#FFFFFF" stroke="#C78B2A" stroke-width="3"/><text x="1030" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Outcome</text><text x="1030" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Matched / corrected / unresolved</text><rect x="220" y="455" width="760" height="86" rx="18" fill="#FFF8EA" stroke="#C78B2A" stroke-width="3"/><text x="600" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">If the evidence does not settle the claim, keep uncertainty visible.</text><text x="600" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Correct it, seek a better source, or leave it unresolved.</text>
</svg>
