<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Purposeful revision loop</title><desc id="desc">A person states the target, inspects a draft, gives one targeted direction, compares versions, and decides to keep, revise, or stop. The loop returns only when a real gap remains.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Revise with a purpose, then decide whether to stop</text><rect x="55" y="195" width="170" height="145" rx="18" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="140" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Target</text><text x="140" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">State what good
looks like</text><line x1="225" y1="260" x2="270" y2="260" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="275" y="195" width="170" height="145" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="360" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Inspect</text><text x="360" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Find a specific
gap</text><line x1="445" y1="260" x2="490" y2="260" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="495" y="195" width="170" height="145" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="580" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Direct</text><text x="580" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Give one bounded
revision</text><line x1="665" y1="260" x2="710" y2="260" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="715" y="195" width="170" height="145" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="800" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Compare</text><text x="800" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Check the new
version</text><line x1="885" y1="260" x2="930" y2="260" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="935" y="195" width="170" height="145" rx="18" fill="#F1F4F6" stroke="#C78B2A" stroke-width="3"/><text x="1020" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Decide</text><text x="1020" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Keep, revise,
or stop</text><line x1="1018" y1="342" x2="1018" y2="445" stroke="#C78B2A" stroke-width="3" marker-end="url(#arrow)"/><line x1="1018" y1="445" x2="360" y2="445" stroke="#C78B2A" stroke-width="3" marker-end="url(#arrow)"/><line x1="360" y1="445" x2="360" y2="345" stroke="#C78B2A" stroke-width="3" marker-end="url(#arrow)"/><text x="690" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5B6870">Return to inspection only when a real gap remains.</text>
</svg>
