<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Work paths and human review</title><desc id="desc">A worker considers five paths: draft, summarize, brainstorm, verify, and human-only judgment. AI is an option for some work, while a person remains responsible for review and decisions.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Choose the kind of work before choosing the tool</text><rect x="45" y="205" width="190" height="160" rx="18" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="140" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#34495E">Work goal</text><text x="140" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#34495E">What needs</text><text x="140" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#34495E">to happen?</text><line x1="235" y1="285" x2="300" y2="285" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="315" y="175" width="150" height="220" rx="16" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="390" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Draft</text><text x="390" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">AI may suggest
starting language</text><circle cx="390" cy="345" r="12" fill="#C78B2A" stroke="#34495E" stroke-width="3"/><rect x="485" y="175" width="150" height="220" rx="16" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="560" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Summarize</text><text x="560" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">AI may organize
source material</text><circle cx="560" cy="345" r="12" fill="#C78B2A" stroke="#34495E" stroke-width="3"/><rect x="655" y="175" width="150" height="220" rx="16" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="730" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Brainstorm</text><text x="730" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">AI may offer
possible options</text><circle cx="730" cy="345" r="12" fill="#C78B2A" stroke="#34495E" stroke-width="3"/><rect x="825" y="175" width="150" height="220" rx="16" fill="#FFF8EA" stroke="#34495E" stroke-width="3"/><text x="900" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Verify</text><text x="900" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Check claims
against evidence</text><circle cx="900" cy="345" r="12" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><rect x="995" y="175" width="150" height="220" rx="16" fill="#FFF8EA" stroke="#C78B2A" stroke-width="3"/><text x="1070" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#34495E">Human-only</text><text x="1070" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Keep judgment
with a person</text><circle cx="1070" cy="345" r="12" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="600" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#5B6870">Every path ends with a person deciding what is ready to use.</text>
</svg>
