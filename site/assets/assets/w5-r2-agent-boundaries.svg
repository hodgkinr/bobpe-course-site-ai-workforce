<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Bounded agent loop and human checkpoint</title><desc id="desc">A defined goal and approved context inform a model. It can use a narrow read-only tool and receive an observation; a human checkpoint sits before external action. Uncertainty or boundary violations stop and escalate.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">A bounded agent loop keeps people in control</text><rect x="30" y="125" width="190" height="110" rx="16" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="125" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Goal</text><text x="125" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Defined task</text><rect x="285" y="125" width="190" height="110" rx="16" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="380" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Approved context</text><text x="380" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Allowed facts</text><rect x="540" y="125" width="190" height="110" rx="16" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="635" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Model</text><text x="635" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Draft or plan</text><rect x="795" y="125" width="190" height="110" rx="16" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="890" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Read-only tool</text><text x="890" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Narrow access</text><line x1="220" y1="180" x2="285" y2="180" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><line x1="475" y1="180" x2="540" y2="180" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><line x1="730" y1="180" x2="795" y2="180" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="805" y="340" width="190" height="100" rx="16" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="900" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Observation</text><text x="900" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34495E">Source result</text><line x1="890" y1="225" x2="900" y2="335" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><line x1="805" y1="390" x2="740" y2="390" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><line x1="740" y1="390" x2="740" y2="230" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="410" y="355" width="230" height="115" rx="18" fill="#FFF8EA" stroke="#C78B2A" stroke-width="3"/><text x="525" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">Human checkpoint</text><text x="525" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">Approve before action</text><line x1="635" y1="410" x2="642" y2="410" stroke="#C78B2A" stroke-width="4" marker-end="url(#arrow)"/><rect x="75" y="350" width="230" height="100" rx="18" fill="#F5E7E5" stroke="#8A3F37" stroke-width="3"/><text x="190" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#8A3F37">Stop + escalate</text><text x="190" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8A3F37">Unclear, unsafe, or out of scope</text><line x1="525" y1="355" x2="525" y2="275" stroke="#C78B2A" stroke-width="3" marker-end="url(#arrow)"/><line x1="370" y1="205" x2="285" y2="350" stroke="#8A3F37" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#5B6870">A tool can return information; a person authorizes any external action.</text>
</svg>
