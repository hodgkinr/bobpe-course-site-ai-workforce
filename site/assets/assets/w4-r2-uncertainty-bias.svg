<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Review evidence, missing perspectives, and impact</title><desc id="desc">A fictional evaluation is checked for its recorded evidence, people or access conditions missing from the records, and possible impact. The conclusion stays within what the evidence supports.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#34495E">Separate what the records show from what they cannot show</text><rect x="65" y="175" width="275" height="300" rx="18" fill="#F1F4F6" stroke="#34495E" stroke-width="3"/><text x="202" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#34495E">Fictional review</text><text x="202" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">A training invitation</text><text x="202" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">and attendance count</text><text x="202" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#34495E">Observed records</text><text x="202" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Who is missing?</text><line x1="340" y1="320" x2="405" y2="320" stroke="#34495E" stroke-width="4" marker-end="url(#arrow)"/><rect x="415" y="185" width="220" height="255" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="525" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#34495E">Evidence</text><text x="525" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">What was recorded?</text><text x="525" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5B6870">Check source and period</text><rect x="660" y="185" width="220" height="255" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="770" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#34495E">Missing views</text><text x="770" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Who could not take part?</text><text x="770" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5B6870">Check access conditions</text><rect x="905" y="185" width="220" height="255" rx="18" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><text x="1015" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#34495E">Impact</text><text x="1015" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#34495E">Who may be affected?</text><text x="1015" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5B6870">Use qualified review</text><rect x="305" y="500" width="590" height="78" rx="14" fill="#FFF8EA" stroke="#C78B2A" stroke-width="3"/><text x="600" y="533" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34495E">Cautious conclusion</text><text x="600" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#34495E">State only what the evidence supports.</text>
</svg>
